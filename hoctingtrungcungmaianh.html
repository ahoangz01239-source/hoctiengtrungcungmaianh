<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học tiếng Trung cùng Mai Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A2117;
  --paper:#FBF5EA;
  --paper2:#F5EBDA;
  --vermillion:#B7372E;
  --vermillion-dark:#8F2A23;
  --vermillion-light:#F3DAD6;
  --jade:#3F6F5E;
  --jade-light:#DCEAE4;
  --gold:#C79A3D;
  --line:#E7D9C2;
  --card:#FFFFFF;
  --shadow: 0 2px 10px rgba(43,33,20,.06), 0 1px 2px rgba(43,33,20,.08);
  --radius: 14px;
  --hsk1:#3F6F5E;
  --hsk2:#B7372E;
  --hsk3:#C0722B;
  --topic:#6B4A96;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Be Vietnam Pro',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Noto Serif SC','Be Vietnam Pro',serif;
}
.hanzi{font-family:'Noto Sans SC',sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold);color:#fff;}

/* Layout scaffolding */
#app{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none !important;}

/* Seal / brand mark */
.seal{
  width:44px;height:44px;border-radius:10px;
  background:linear-gradient(155deg,var(--vermillion),var(--vermillion-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-weight:900;font-size:20px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
  flex-shrink:0;
}

/* Top bar (site-wide) */
.topbar{
  background:linear-gradient(120deg,var(--vermillion-dark),var(--vermillion) 70%);
  color:#fff;
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  position:relative;
  z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.topbar .brand-text .name{font-weight:800;font-size:17px;letter-spacing:.2px;}
.topbar .brand-text .tag{font-size:11.5px;opacity:.82;margin-top:1px;}
.topbar nav{display:flex;gap:6px;align-items:center;}
.topbar nav a, .topbar nav button.navlink{
  color:#fff;opacity:.88;font-size:14px;font-weight:600;
  padding:8px 14px;border-radius:8px;background:transparent;border:none;
}
.topbar nav a:hover,.topbar nav button.navlink:hover{opacity:1;background:rgba(255,255,255,.12);}
.topbar .user-pill{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);
  padding:6px 8px 6px 6px;border-radius:999px;font-size:13px;font-weight:600;
}
.topbar .user-pill .av{
  width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2a05;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;
}
.btn-logout{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.btn-logout:hover{background:rgba(255,255,255,.26);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;font-weight:700;font-size:14.5px;border:none;
  transition:transform .12s ease, box-shadow .12s ease, background .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--vermillion);color:#fff;box-shadow:0 4px 14px rgba(183,55,46,.35);}
.btn-primary:hover{background:var(--vermillion-dark);}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--vermillion);color:var(--vermillion);}
.btn-jade{background:var(--jade);color:#fff;}
.btn-jade:hover{background:#2e594a;}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Landing */
.landing-hero{
  background:radial-gradient(1100px 480px at 80% -10%, #FBEAE2 0%, transparent 60%), var(--paper);
  padding:64px 24px 40px;text-align:center;border-bottom:1px solid var(--line);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;background:var(--vermillion-light);color:var(--vermillion-dark);
  font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:22px;
}
.landing-hero h1{font-size:42px;line-height:1.18;margin:0 0 14px;color:var(--ink);font-weight:800;}
.landing-hero h1 .accent{color:var(--vermillion);display:block;font-size:44px;margin-top:4px;}
.landing-hero p.sub{color:#5b5040;font-size:16.5px;max-width:620px;margin:0 auto 34px;line-height:1.6;}
.stats-row{display:flex;justify-content:center;gap:56px;flex-wrap:wrap;max-width:820px;margin:0 auto;}
.stat{text-align:center;}
.stat b{display:block;font-size:30px;color:var(--vermillion);font-family:'Noto Serif SC',serif;}
.stat span{font-size:13px;color:#6b6152;}

.section{padding:56px 24px;max-width:1180px;margin:0 auto;}
.section h2{text-align:center;font-size:28px;margin:0 0 6px;}
.section p.section-sub{text-align:center;color:#6b6152;margin:0 0 36px;font-size:15px;}

.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media(max-width:980px){.level-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.level-grid{grid-template-columns:1fr;}}
.level-card{
  background:var(--card);border:1.5px solid var(--line);border-top:4px solid var(--jade);
  border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;position:relative;
  transition:transform .15s ease, box-shadow .15s ease;
}
.level-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(43,33,20,.12);}
.level-card.locked{opacity:.72;}
.level-card .lv-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.level-card .lv-tag{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
.level-card h3{margin:0;font-size:19px;}
.level-card p{margin:0;font-size:13.5px;color:#655a49;line-height:1.5;flex:1;}
.level-card .lv-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:14px;font-size:12.5px;color:#7a6e5b;}

.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.feat-grid{grid-template-columns:1fr;}}
.feat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.feat-card .fi{font-size:26px;margin-bottom:10px;}
.feat-card h4{margin:0 0 6px;font-size:15.5px;}
.feat-card p{margin:0;font-size:13.5px;color:#655a49;line-height:1.55;}

.landing-footer{padding:26px 24px;text-align:center;font-size:12.5px;color:#8a7d68;border-top:1px solid var(--line);}

/* Auth screen */
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;
  background:radial-gradient(900px 420px at 50% -10%, #F8E4DC 0%, transparent 60%), var(--paper);}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(43,33,20,.12);
  padding:38px 34px;width:100%;max-width:400px;text-align:center;}
.auth-card .seal{margin:0 auto 14px;width:56px;height:56px;font-size:26px;}
.auth-card h2{margin:0 0 2px;font-size:20px;}
.auth-card .sub{color:#6b6152;font-size:13px;margin-bottom:22px;}
.role-toggle{display:flex;background:var(--paper2);border-radius:10px;padding:4px;margin-bottom:20px;}
.role-toggle button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:700;font-size:13.5px;color:#6b6152;}
.role-toggle button.active{background:#fff;color:var(--vermillion);box-shadow:0 2px 6px rgba(0,0,0,.08);}
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:#584d3d;margin-bottom:6px;}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;background:#fff;font-family:inherit;}
.field input:focus,.field select:focus{outline:none;border-color:var(--vermillion);}
.auth-error{background:#FBE3E1;color:#9C2E26;font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:8px;margin-bottom:14px;text-align:left;}
.auth-switch{margin-top:16px;font-size:12.5px;color:#7a6e5b;}
.auth-switch b{color:var(--vermillion);cursor:pointer;}
.demo-hint{margin-top:18px;font-size:11.5px;color:#9c9382;line-height:1.6;border-top:1px dashed var(--line);padding-top:14px;}

/* App shell */
.app-shell{display:flex;flex:1;min-height:0;}
.sidebar{
  width:270px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  padding:18px 14px 40px;overflow-y:auto;
}
.sidebar .sb-group-label{font-size:11px;font-weight:800;letter-spacing:.6px;color:#a89a80;margin:18px 10px 8px;text-transform:uppercase;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;
  color:#4a4033;margin-bottom:2px;cursor:pointer;
}
.sb-item:hover{background:var(--paper2);}
.sb-item.active{background:var(--vermillion);color:#fff;}
.sb-item .ic{width:20px;text-align:center;flex-shrink:0;}
.sb-course{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:#332b1f;}
.sb-course:hover{background:var(--paper2);}
.sb-course .count{margin-left:auto;font-size:11.5px;color:#a89a80;font-weight:600;}
.sb-course .chev{transition:transform .15s;font-size:11px;color:#a89a80;}
.sb-course.open .chev{transform:rotate(90deg);}
.sb-lessons{margin-left:8px;border-left:2px solid var(--paper2);padding-left:8px;}
.sb-lesson{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13.3px;color:#5b5142;font-weight:500;cursor:pointer;}
.sb-lesson:hover{background:var(--paper2);}
.sb-lesson.active{background:var(--vermillion);color:#fff;font-weight:700;}
.sb-lesson .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0;}
.sb-lesson.done .dot{background:var(--jade);}
.sb-lesson.active .dot{background:#fff;}

.content{flex:1;min-width:0;overflow-y:auto;padding:26px 32px 60px;}
.crumb{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#7a6e5b;margin-bottom:18px;font-weight:600;}
.crumb .back{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);padding:7px 13px;border-radius:8px;color:var(--ink);cursor:pointer;}
.crumb .back:hover{background:var(--line);}
.crumb .cur{color:var(--ink);}

/* Home dashboard */
.welcome-banner{
  background:linear-gradient(120deg,var(--vermillion-dark),var(--vermillion));
  color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
}
.welcome-banner h2{margin:0 0 4px;font-size:21px;}
.welcome-banner p{margin:0;opacity:.9;font-size:13.5px;}
.wb-progress{background:rgba(255,255,255,.15);border-radius:12px;padding:12px 18px;text-align:center;min-width:120px;}
.wb-progress b{font-size:24px;display:block;}
.wb-progress span{font-size:11.5px;opacity:.85;}

.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
@media(max-width:900px){.dash-grid{grid-template-columns:repeat(2,1fr);}}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;}
.dash-card:hover{transform:translateY(-2px);}
.dash-card .di{font-size:22px;margin-bottom:8px;}
.dash-card h4{margin:0 0 4px;font-size:14.5px;}
.dash-card p{margin:0;font-size:12px;color:#7a6e5b;line-height:1.5;}

.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:980px){.lesson-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.lesson-grid{grid-template-columns:1fr;}}
.lesson-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;}
.lesson-card:hover{border-color:var(--vermillion);}
.lesson-card .lc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.lesson-card .lc-num{width:30px;height:30px;border-radius:8px;background:var(--jade-light);color:var(--jade);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.lesson-card.done .lc-num{background:var(--jade);color:#fff;}
.lesson-card .lc-cn{font-weight:700;font-size:15px;}
.lesson-card .lc-vi{font-size:12.5px;color:#7a6e5b;margin-top:2px;}
.lesson-card .lc-bar{height:5px;background:var(--paper2);border-radius:3px;margin-top:12px;overflow:hidden;}
.lesson-card .lc-bar-fill{height:100%;background:var(--jade);border-radius:3px;}

/* Lesson page tabs */
.lesson-hero{background:linear-gradient(120deg,var(--vermillion-dark),var(--vermillion));color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:20px;position:relative;overflow:hidden;}
.lesson-hero:before{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);}
.lesson-hero .hz{font-family:'Noto Serif SC',serif;font-size:15px;opacity:.85;margin-bottom:4px;}
.lesson-hero h2{margin:0 0 6px;font-size:22px;}
.lesson-hero p{margin:0;opacity:.9;font-size:13.5px;}

.tabbar{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:20px;box-shadow:var(--shadow);}
.tabbtn{background:var(--paper2);color:#5b5142;border:none;padding:10px 15px;border-radius:9px;font-size:13.3px;font-weight:700;display:flex;align-items:center;gap:7px;}
.tabbtn:hover{background:var(--vermillion-light);color:var(--vermillion-dark);}
.tabbtn.active{background:var(--vermillion);color:#fff;}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
.panel h3{margin:0 0 14px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.panel h3 .bar{width:4px;height:16px;background:var(--vermillion);border-radius:2px;display:inline-block;}

table.vocab-table{width:100%;border-collapse:collapse;font-size:13.8px;}
table.vocab-table th{background:var(--vermillion-light);color:var(--vermillion-dark);text-align:left;padding:10px 12px;font-size:12.5px;font-weight:800;}
table.vocab-table td{padding:10px 12px;border-bottom:1px solid var(--paper2);}
table.vocab-table tr:last-child td{border-bottom:none;}
table.vocab-table .hz{font-weight:700;font-size:16px;font-family:'Noto Sans SC',sans-serif;}
table.vocab-table .py{color:var(--vermillion);font-weight:600;}
.speak-btn{background:var(--jade-light);color:var(--jade);border:none;width:26px;height:26px;border-radius:7px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle;}
.speak-btn:hover{background:var(--jade);color:#fff;}

.dlg-block{border-left:3px solid var(--vermillion);background:var(--paper2);border-radius:0 10px 10px 0;padding:16px 18px;margin-bottom:14px;}
.dlg-block h4{margin:0 0 12px;font-size:13.5px;color:var(--vermillion-dark);}
.dlg-line{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;}
.dlg-line:last-child{margin-bottom:0;}
.dlg-line .spk{width:78px;flex-shrink:0;font-size:12px;font-weight:700;color:#8a7d68;padding-top:2px;text-align:right;}
.dlg-line .bubble{background:#fff;border-radius:10px;padding:9px 13px;flex:1;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.dlg-line .cn{font-size:15px;font-weight:600;margin-bottom:3px;}
.dlg-line .vi{font-size:12.5px;color:#7a6e5b;font-style:italic;}

/* Flashcard */
.flash-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;}
.flash-progress{font-size:12.5px;color:#7a6e5b;margin-bottom:14px;font-weight:600;}
.flashcard{width:100%;max-width:420px;height:230px;perspective:1200px;cursor:pointer;}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(43,33,20,.14);}
.flashcard-front{background:linear-gradient(135deg,#fff,var(--paper2));border:1.5px solid var(--line);}
.flashcard-front .hz{font-size:52px;font-weight:700;}
.flashcard-front .hint{margin-top:10px;font-size:12px;color:#a89a80;}
.flashcard-back{background:linear-gradient(135deg,var(--jade),#2e594a);color:#fff;transform:rotateY(180deg);}
.flashcard-back .py{font-size:22px;font-weight:700;margin-bottom:8px;}
.flashcard-back .vi{font-size:16px;}
.flash-nav{display:flex;gap:10px;margin-top:20px;}

/* Matching game */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:640px){.match-grid{grid-template-columns:1fr;}}
.match-col h5{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#a89a80;margin:0 0 10px;}
.match-item{background:var(--paper2);border:2px solid transparent;border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;}
.match-item:hover{border-color:var(--vermillion);}
.match-item.selected{border-color:var(--vermillion);background:var(--vermillion-light);}
.match-item.correct{background:var(--jade-light);border-color:var(--jade);color:var(--jade);}
.match-item.wrong{background:#FBE3E1;border-color:#C0433A;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.match-status{text-align:center;margin-top:16px;font-size:13.5px;font-weight:700;color:var(--jade);}

/* Quiz */
.quiz-box{max-width:560px;margin:0 auto;text-align:center;}
.quiz-q{font-size:15px;color:#7a6e5b;margin-bottom:6px;font-weight:600;}
.quiz-hz{font-size:38px;font-weight:700;margin-bottom:24px;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.quiz-opts{grid-template-columns:1fr;}}
.quiz-opt{background:#fff;border:2px solid var(--line);border-radius:11px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;}
.quiz-opt:hover{border-color:var(--vermillion);}
.quiz-opt.correct{background:var(--jade-light);border-color:var(--jade);color:var(--jade);}
.quiz-opt.wrong{background:#FBE3E1;border-color:#C0433A;color:#9C2E26;}
.quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
.quiz-score{font-size:13px;color:#7a6e5b;font-weight:700;}
.quiz-result{text-align:center;padding:30px 10px;}
.quiz-result .big{font-size:44px;font-weight:800;color:var(--vermillion);margin-bottom:6px;font-family:'Noto Serif SC',serif;}

/* Stats panel */
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px;}
@media(max-width:640px){.stat-cards{grid-template-columns:1fr;}}
.stat-card{background:var(--paper2);border-radius:12px;padding:16px;text-align:center;}
.stat-card b{display:block;font-size:24px;color:var(--vermillion);}
.stat-card span{font-size:12px;color:#7a6e5b;}

/* Tables */
.data-table-wrap{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:13.3px;min-width:640px;}
table.data-table th{background:var(--paper2);text-align:left;padding:10px 12px;font-weight:800;font-size:12px;color:#5b5142;position:sticky;top:0;}
table.data-table td{padding:9px 12px;border-bottom:1px solid var(--paper2);color:#4a4033;}
table.data-table tr:hover td{background:#FBF7EF;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.badge-green{background:var(--jade-light);color:var(--jade);}
.badge-gold{background:#F6E9C9;color:#8a6a10;}
.badge-red{background:var(--vermillion-light);color:var(--vermillion-dark);}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;}
.empty-state{text-align:center;padding:50px 20px;color:#a89a80;}
.empty-state .ei{font-size:32px;margin-bottom:10px;}

.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title-row h2{margin:0;font-size:20px;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-280px;top:0;bottom:0;z-index:40;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.2);}
  .sidebar.open{left:0;}
  .content{padding:20px 16px 50px;}
  .topbar nav{display:none;}
  .menu-toggle{display:inline-flex !important;}
}
@media(max-width:640px){
  .topbar{flex-wrap:wrap;padding:12px 16px;gap:10px;}
  .topbar .brand-text .tag{display:none;}
  .landing-hero h1{font-size:30px;}
  .landing-hero h1 .accent{font-size:30px;}
  .stats-row{gap:28px;}
  .section{padding:40px 16px;}
  .auth-card{padding:28px 22px;}
}
.menu-toggle{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;font-size:16px;}
</style>

      {s:"陈天中", cn:"你去超市买什么？", vi:"Bạn đi siêu thị mua gì?"},
      {s:"白家月", cn:"我想买些牛奶。", vi:"Mình muốn mua ít sữa."},
    ]},
    {t:"Bài khoá 3", lines:[

      {s:"王一雪", cn:"那边的包子非常好吃，我想吃包子。", vi:"Bánh bao ở đó rất ngon."},

      {s:"王一雪", cn:"好的。我们怎么去？", vi:"Được rồi. Đi thế nào?"},
      {s:"刘明", cn:"坐出租车去。", vi:"Đi taxi nhé."},
    ]},

      {s:"白家月", cn:"对。我们晚上去那个电影院看电影吧。", vi:"Đúng rồi. Tối nay đến đó xem phim nhé."},

    ]},
    {t:"Bài khoá 3", lines:[
      {s:"王一雪", cn:"明天星期六，你做什么？", vi:"Mai thứ Bảy, em làm gì?"},
      {s:"杨同乐", cn:"我白天在家里读书，晚上和朋友们去外边唱歌。", vi:"Ban ngày em đọc sách ở nhà, tối đi hát với bạn."},

      {s:"李文", cn:"还不知道，正在找呢。它是不是在超市后边？", vi:"Chưa biết nữa, em đang tìm. Có phải sau siêu thị không ạ?"},
      {s:"王一飞", cn:"是的。你开车没开车？", vi:"Đúng rồi. Em có lái xe không?"},
      {s:"李文", cn:"我没开车，坐车呢。", vi:"Em không lái xe, đang đi taxi."},
    ]},
    {t:"Bài khoá 2", lines:[
      {s:"王一飞", cn:"你还在读大学吗？", vi:"Em vẫn còn đang học đại học à?"},
      {s:"李文", cn:"对，我读大学呢，还是大学生。", vi:"Vâng, em đang học đại học, vẫn là sinh viên."},
      {s:"王一飞", cn:"你们学习忙不忙？", vi:"Học hành có bận không em?"},
      {s:"李文", cn:"非常忙，我学医，我们的课很多。", vi:"Bận lắm ạ, em học y nên nhiều môn lắm."},
    ]},
    {t:"Bài khoá 3", lines:[
      {s:"刘明", cn:"弟弟起床没起床呢？", vi:"Em trai đã dậy chưa?"},
      {s:"刘小雪", cn:"没起床呢，还在睡觉。", vi:"Chưa dậy đâu, vẫn đang ngủ."},
      {s:"刘明", cn:"还睡呢？他今天去不去那里？", vi:"Vẫn ngủ à? Hôm nay nó có đi đâu không?"},
      {s:"刘小雪", cn:"去哪里？", vi:"Đi đâu cơ ạ?"},
      {s:"刘明", cn:"去超市。", vi:"Đi siêu thị."},
      {s:"刘小雪", cn:"我昨天问他，他对我说，他今天要和小朋友玩。", vi:"Hôm qua con hỏi rồi, nó bảo hôm nay định chơi với bạn."},
    ]},
  ]
},

// Chuẩn hoá lưu trữ bằng localStorage tiêu chuẩn
function storeGet(key, fallback){
  try{
    const val = localStorage.getItem('hsk_' + key);
    return val !== null ? JSON.parse(val) : fallback;
  }catch(e){
    console.error("Lỗi đọc dữ liệu:", e);
    return fallback;
  }
}

function storeSet(key, value){
  try{
    localStorage.setItem('hsk_' + key, JSON.stringify(value));
  }catch(e){
    console.error("Lỗi ghi dữ liệu:", e);
  }
}

function loadAll(){
  STATE.users = storeGet("users", []);
  STATE.activities = storeGet("activities", []);
  STATE.progress = storeGet("progress", {});

  // Đảm bảo luôn có tài khoản giáo viên mẫu
  const tIdx = STATE.users.findIndex(u => u.role === "teacher");
  if(tIdx !== -1){
    STATE.users[tIdx] = TEACHER_SEED;
  } else {
    STATE.users.push(TEACHER_SEED);
  }
  storeSet("users", STATE.users);
}

function persistUsers(){ storeSet("users", STATE.users); }
function persistActivities(){ 
  if(STATE.activities.length > 400) STATE.activities = STATE.activities.slice(-400);
  storeSet("activities", STATE.activities); 
}
function persistProgress(){ storeSet("progress", STATE.progress); }

function nowStr(){
  const d = new Date();
  return d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
}

function logActivity(action, detail, opts){
  opts = opts||{};
  const entry = {
    id: Date.now()+"_"+Math.random().toString(36).slice(2,7),
    time: nowStr(),
    ts: Date.now(),
    username: STATE.user.username,
    name: STATE.user.name,
    cls: STATE.user.cls||"—",
    lessonId: opts.lessonId||null,
    lessonTitle: opts.lessonTitle||"",
    action, detail: detail||"",
    durationSec: opts.durationSec||null,
    score: opts.score!=null? opts.score : null,
  };
  STATE.activities.push(entry);
  persistActivities();
}

function getProgress(username, lessonId){
  if(!STATE.progress[username]) STATE.progress[username] = {};
  if(!STATE.progress[username][lessonId]) STATE.progress[username][lessonId] = {learned:[], quizBest:{}, timeSec:0};
  return STATE.progress[username][lessonId];
}

function saveProgressField(lessonId, mutator){
  const p = getProgress(STATE.user.username, lessonId);
  mutator(p);
  persistProgress();
}

function speak(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function render(){
  const app = document.getElementById('app');
  if(STATE.view==="landing") app.innerHTML = renderLanding();
  else if(STATE.view==="login") app.innerHTML = renderLogin();
  else if(STATE.view==="student") app.innerHTML = renderStudentShell();
  else if(STATE.view==="teacher") app.innerHTML = renderTeacherShell();
  window.scrollTo(0,0);
  attachHandlers();
}

function go(view, extra){ STATE.view = view; if(extra) Object.assign(STATE, extra); render(); }

    <div class="auth-card">

      <h2>${isRegister? "Tạo tài khoản mới":"Đăng nhập"}</h2>
      <div class="sub">${BRAND}</div>
      <div class="role-toggle">
        <button class="${!isTeacher?'active':''}" onclick="STATE.authRole='student';STATE.authError='';render()">🎒 Học sinh</button>

      <form id="authForm">

        ${(!isTeacher && isRegister)? `<div class="field"><label>Lớp (không bắt buộc)</label><input type="text" id="f-cls" placeholder="Ví dụ: HSK1-A"></div>`:""}
        <div class="field"><label>Mật khẩu</label><input type="password" id="f-pass" placeholder="••••••" required></div>
        <button type="submit" class="btn btn-primary btn-block">${isRegister? "Đăng ký":"Đăng nhập"}</button>
      </form>
      ${!isTeacher? `<div class="auth-switch">${isRegister? 'Đã có tài khoản? ':'Học viên mới? '}<b onclick="switchAuthMode('${isRegister?'login':'register'}')">${isRegister? "Đăng nhập":"Đăng ký ngay"}</b></div>`:""}
    </div>
  </div>
  `;
}

function switchAuthMode(mode){ STATE.authMode = mode; STATE.authError=''; render(); }

function handleAuthSubmit(e){
  e.preventDefault();
  const nameInput = document.getElementById('f-name').value.trim();
  const pass = document.getElementById('f-pass').value;
  const clsEl = document.getElementById('f-cls');
  const cls = clsEl ? clsEl.value.trim() : "";

  if(!nameInput || !pass){ 
    STATE.authError = "Vui lòng nhập đầy đủ thông tin."; 
    render(); 
    return; 
  }

  const cleanInput = nameInput.toLowerCase();
  const isTeacher = STATE.authRole === "teacher";

  if(isTeacher){
    const u = STATE.users.find(x => x.role === "teacher" && (x.username === cleanInput || x.name.toLowerCase() === cleanInput));
    if(!u || u.password !== pass){ 
      STATE.authError = "Sai tên đăng nhập hoặc mật khẩu giáo viên."; 
      render(); 
      return; 
    }
    STATE.user = u; 
    STATE.view = "teacher"; 
    STATE.teacherTab = "overview"; 
    STATE.authError = ""; 
    render(); 
    return;
  }

  // Xử lý học sinh
  let u = STATE.users.find(x => x.role === "student" && (x.username === cleanInput || x.name.toLowerCase() === cleanInput));

  if(STATE.authMode === "register"){
    if(u){ 
      STATE.authError = "Tài khoản hoặc tên này đã tồn tại. Vui lòng chuyển sang Đăng nhập."; 
      render(); 
      return; 
    }
    u = {
      username: cleanInput, 
      name: nameInput, 
      role: "student", 
      password: pass, 
      cls: cls || "Chưa phân lớp", 
      createdAt: Date.now()
    };
    STATE.users.push(u);
    persistUsers(); // Lưu ngay vào localStorage
  } else {
    if(!u){ 
      STATE.authError = "Tài khoản không tồn tại. Vui lòng kiểm tra lại hoặc bấm 'Đăng ký ngay'."; 
      render(); 
      return; 
    }
    if(u.password !== pass){ 
      STATE.authError = "Sai mật khẩu."; 
      render(); 
      return; 
    }
  }

  STATE.user = u; 
  STATE.view = "student"; 
  STATE.studentTab = "home"; 
  STATE.authError = ""; 
  STATE.currentLessonId = null;
  render();
  logActivity("Đăng nhập", "Đã đăng nhập vào hệ thống");
}

function openLesson(id){
  STATE.currentLessonId = id; STATE.studentTab="lesson"; STATE.lessonTab="vocab"; STATE.sidebarOpen=false;
  resetActivityState();
  render();
  const l = LESSONS.find(x=>x.id===id);
  logActivity("Mở bài học", "Ôn tập HSK1 - Bài "+id, {lessonId:id, lessonTitle:l.cn});
}

function resetActivityState(){
  STATE.flash = {idx:0, flipped:false};
  STATE.match = {leftSel:null, pairs:[], solved:[], startTs:Date.now()};
  STATE.quiz = {qIdx:0, score:0, order:[], answered:false, chosen:null, total:8};
  STATE.listen = {qIdx:0, score:0, order:[], answered:false, chosen:null, total:8};
}

  let totalLearned=0, totalWords=0;
  LESSONS.forEach(l=>{ const p=getProgress(STATE.user.username,l.id); totalLearned+=p.learned.length; totalWords+=l.vocab.length; });

  const cards = LESSONS.map(l=>{
    const prog = getProgress(STATE.user.username, l.id);
    const pct = Math.round(100*prog.learned.length/l.vocab.length);
    return `
    <div class="lesson-card ${pct>=100?'done':''}" onclick="openLesson(${l.id})">
      <div class="lc-top">
        <div class="lc-num">${pct>=100?'✓':l.id}</div>
        <div>
          <div class="lc-cn hanzi">${l.cn}</div>
          <div class="lc-vi">${l.vi}</div>
        </div>
      </div>
      <div class="lc-bar"><div class="lc-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");

  return `
    <div class="welcome-banner">
      <div>
        <h2>Xin chào, ${STATE.user.name.split(' ').pop()}! 👋</h2>

        <div class="di">✍️</div><h4>Luyện bài tập</h4><p>Trắc nghiệm nghĩa từ, kiểm tra nhanh sau mỗi bài</p>
      </div>
      <div class="dash-card" onclick="openLesson(${firstUnfinishedLesson()});STATE.lessonTab='listen';render()">
        <div class="di">🎧</div><h4>Nghe hiểu</h4><p>Luyện phản xạ nghe – chọn đáp án đúng</p>

function firstUnfinishedLesson(){
  for(const l of LESSONS){
    const p = getProgress(STATE.user.username, l.id);
    if(p.learned.length < l.vocab.length) return l.id;
  }
  return 1;
}

function renderLessonPage(l){
  const tabs = [
    ["vocab","📖","Từ vựng & Bài khoá"],
    ["flash","🃏","Flashcard"],
    ["match","🧩","Ghép cặp"],
    ["quiz","✅","Trắc nghiệm"],
    ["listen","🎧","Nghe & chọn"],
    ["stats","📊","Thống kê"],
  ];
  const tabbar = tabs.map(([k,ic,label])=>`<button class="tabbtn ${STATE.lessonTab===k?'active':''}" onclick="switchLessonTab('${k}')">${ic} ${label}</button>`).join("");

  let panel="";
  if(STATE.lessonTab==="vocab") panel = renderVocabPanel(l);
  else if(STATE.lessonTab==="flash") panel = renderFlashPanel(l);
  else if(STATE.lessonTab==="match") panel = renderMatchPanel(l);
  else if(STATE.lessonTab==="quiz") panel = renderQuizPanel(l);
  else if(STATE.lessonTab==="listen") panel = renderListenPanel(l);
  else if(STATE.lessonTab==="stats") panel = renderStatsPanel(l);

  return `
    <div class="crumb"><span class="back" onclick="STATE.studentTab='home';STATE.currentLessonId=null;render()">← Trang chủ</span><span class="cur">Bài ${l.id}</span></div>
    <div class="lesson-hero">
      <div class="hz hanzi">新HSK1 · 第${l.id}课</div>
      <h2 class="hanzi">${l.cn} <span style="font-weight:400;font-size:14px;opacity:.85">/ ${l.py}</span></h2>
      <p>${l.vi}</p>
    </div>
    <div class="tabbar">${tabbar}</div>
    ${panel}
  `;
}

function switchLessonTab(tab){
  STATE.lessonTab = tab;
  if(tab==="quiz" && STATE.quiz.order.length===0) initQuiz();
  if(tab==="listen" && STATE.listen.order.length===0) initListen();
  if(tab==="match" && STATE.match.pairs.length===0) initMatch();
  render();
}

function renderVocabPanel(l){
  const rows = l.vocab.map((w)=>`
    <tr>
      <td class="hz">${w.h} <button class="speak-btn" onclick="speak('${w.h}')">🔊</button></td>
      <td class="py">${w.p}</td>
      <td>${w.pos}</td>
      <td>${w.v}</td>
    </tr>`).join("");

  const dialogues = l.dialogues.map((d)=>`
    <div class="dlg-block">
      <h4>💬 ${d.t} <button class="btn btn-jade btn-sm" style="margin-left:8px" onclick='speak(${JSON.stringify(d.lines.map(x=>x.cn).join("，"))})'>🔊 Nghe cả đoạn</button></h4>
      ${d.lines.map(ln=>`
        <div class="dlg-line">
          <div class="spk">${ln.s}</div>
          <div class="bubble">
            <div class="cn hanzi">${ln.cn} <button class="speak-btn" onclick="speak('${ln.cn.replace(/'/g,"\\'")}')">🔊</button></div>
            <div class="vi">${ln.vi}</div>
          </div>
        </div>`).join("")}
    </div>
  `).join("");

  return `
    <div class="panel">
      <h3><span class="bar"></span>📘 Từ vựng (生词) — ${l.vocab.length} từ</h3>
      <table class="vocab-table">
        <thead><tr><th>汉字</th><th>Phiên âm</th><th>Từ loại</th><th>Nghĩa tiếng Việt</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="panel">
      <h3><span class="bar"></span>📗 Bài khoá (课文)</h3>
      ${dialogues}
    </div>
  `;
}

      <h3><span class="bar"></span>🃏 Flashcard lật thẻ</h3>
      <div class="flash-wrap">
        <div class="flash-progress">Thẻ ${idx+1} / ${l.vocab.length} · Đã học: ${learnedCount}/${l.vocab.length}</div>
        <div class="flashcard ${STATE.flash.flipped?'flipped':''}" onclick="flipFlash()">
          <div class="flashcard-inner">
            <div class="flashcard-face flashcard-front hanzi">
              <div class="hz">${w.h}</div>
              <div class="hint">Nhấn để xem nghĩa</div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="py">${w.p}</div>
              <div class="vi">${w.v}</div>
            </div>
          </div>
        </div>
        <div class="flash-nav">
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();navFlash(-1)">← Trước</button>
          <button class="btn btn-jade btn-sm" onclick="event.stopPropagation();speak('${w.h}')">🔊 Nghe</button>
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();navFlash(1)">Sau →</button>
        </div>
      </div>
    </div>
  `;
}

function flipFlash(){
  STATE.flash.flipped = !STATE.flash.flipped;
  render();
  if(STATE.flash.flipped){
    const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
    markLearned(l.id, STATE.flash.idx);
  }
}

function navFlash(d){
  const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
  let idx = STATE.flash.idx + d;
  if(idx<0) idx = l.vocab.length-1;
  if(idx>=l.vocab.length) idx = 0;
  STATE.flash.idx = idx; STATE.flash.flipped=false;
  render();
}

function markLearned(lessonId, wordIdx){
  const l = LESSONS.find(x=>x.id===lessonId);
  const p = getProgress(STATE.user.username, lessonId);
  if(!p.learned.includes(wordIdx)){
    p.learned.push(wordIdx);
    persistProgress();
    if(p.learned.length===l.vocab.length){
      logActivity("Hoàn thành từ vựng", "Đã học hết "+l.vocab.length+" từ", {lessonId, lessonTitle:l.cn});
    }
  }
}

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function initMatch(){
  const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
  const n = Math.min(6, l.vocab.length);
  const idxs = shuffle([...Array(l.vocab.length).keys()]).slice(0,n);
  STATE.match = {
    leftSel:null,
    pairs: idxs.map(i=>({idx:i, h:l.vocab[i].h, v:l.vocab[i].v})),
    rightOrder: shuffle(idxs.slice()),
    solved: [],
    startTs: Date.now(),
  };
}

function renderMatchPanel(l){
  if(STATE.match.pairs.length===0) initMatch();
  const m = STATE.match;
  const leftHtml = m.pairs.map(p=>{
    const solved = m.solved.includes(p.idx);
    const sel = m.leftSel===p.idx;
    return `<div class="match-item ${solved?'correct':''} ${sel?'selected':''}" onclick="matchClickLeft(${p.idx})">${l.vocab[p.idx].h}</div>`;
  }).join("");
  const rightHtml = m.rightOrder.map(idx=>{
    const p = m.pairs.find(x=>x.idx===idx);
    const solved = m.solved.includes(idx);
    return `<div class="match-item ${solved?'correct':''}" id="match-r-${idx}" onclick="matchClickRight(${idx})">${p.v}</div>`;
  }).join("");
  const done = m.solved.length===m.pairs.length;
  return `
    <div class="panel">
      <h3><span class="bar"></span>🧩 Trò chơi ghép cặp (Hán tự ↔ Nghĩa tiếng Việt)</h3>
      <div class="match-grid">
        <div class="match-col"><h5>Hán tự</h5>${leftHtml}</div>
        <div class="match-col"><h5>Nghĩa tiếng Việt</h5>${rightHtml}</div>
      </div>
      <div class="match-status">${done? "🎉 Hoàn thành! " + m.solved.length + "/" + m.pairs.length + " cặp đúng." : `Đã ghép: ${m.solved.length}/${m.pairs.length}`}</div>
      <div style="text-align:center;margin-top:14px;"><button class="btn btn-ghost btn-sm" onclick="initMatch();render()">🔄 Chơi lại</button></div>
    </div>
  `;
}

function matchClickLeft(idx){
  if(STATE.match.solved.includes(idx)) return;
  STATE.match.leftSel = idx; render();
}

function matchClickRight(idx){
  const m = STATE.match;
  if(m.leftSel==null || m.solved.includes(idx)) return;
  const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
  if(m.leftSel===idx){
    m.solved.push(idx); m.leftSel=null; render();
    markLearned(l.id, idx);
    if(m.solved.length===m.pairs.length){
      const durationSec = Math.round((Date.now()-m.startTs)/1000);
      logActivity("Trò chơi ghép cặp", "Hoàn thành "+m.pairs.length+" cặp", {lessonId:l.id, lessonTitle:l.cn, durationSec, score:100});
    }
  } else {
    const el = document.getElementById('match-r-'+idx);
    if(el){ el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),350); }
    m.leftSel=null;
  }
}

function buildQuizQuestions(l, n){
  const idxs = shuffle([...Array(l.vocab.length).keys()]).slice(0, Math.min(n,l.vocab.length));
  return idxs.map(i=>{
    const correct = l.vocab[i];
    let pool = l.vocab.filter((w,j)=>j!==i);
    pool = shuffle(pool.slice()).slice(0,3);
    const opts = shuffle([correct, ...pool].map(w=>w.v));
    return {wordIdx:i, hz:correct.h, py:correct.p, answer:correct.v, opts};
  });
}

function initQuiz(){
  const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
  STATE.quiz = {qIdx:0, score:0, order:buildQuizQuestions(l,8), answered:false, chosen:null, total:8};
}

function renderQuizPanel(l){
  if(STATE.quiz.order.length===0) initQuiz();
  const q = STATE.quiz;
  if(q.qIdx>=q.order.length){
    const pct = Math.round(100*q.score/q.order.length);
    return `
    <div class="panel">
      <div class="quiz-result">
        <div class="big">${pct}%</div>
        <p>Bạn trả lời đúng ${q.score}/${q.order.length} câu.</p>
        <button class="btn btn-primary" onclick="initQuiz();render()">🔁 Làm lại</button>
      </div>
    </div>`;
  }
  const cur = q.order[q.qIdx];
  const optsHtml = cur.opts.map(o=>{
    let cls="quiz-opt";
    if(q.answered){
      if(o===cur.answer) cls+=" correct";
      else if(o===q.chosen) cls+=" wrong";
    }
    return `<button class="${cls}" ${q.answered?'disabled':''} onclick="answerQuiz(${JSON.stringify(o).replace(/"/g,'&quot;')})">${o}</button>`;
  }).join("");
  return `
    <div class="panel">
      <h3><span class="bar"></span>✅ Trắc nghiệm nghĩa từ</h3>
      <div class="quiz-box">
        <div class="quiz-q">Câu ${q.qIdx+1}/${q.order.length} — Nghĩa của từ dưới đây là gì?</div>
        <div class="quiz-hz hanzi">${cur.hz} <button class="speak-btn" onclick="speak('${cur.hz}')">🔊</button></div>
        <div class="quiz-opts">${optsHtml}</div>
        <div class="quiz-footer">
          <span class="quiz-score">Điểm: ${q.score}/${q.qIdx}</span>
          ${q.answered? `<button class="btn btn-primary btn-sm" onclick="nextQuiz()">Câu tiếp →</button>` : ""}
        </div>
      </div>
    </div>
  `;
}

function answerQuiz(chosen){
  const q = STATE.quiz;
  if(q.answered) return;
  q.answered = true; q.chosen = chosen;
  const cur = q.order[q.qIdx];
  if(chosen===cur.answer){ q.score++; markLearned(STATE.currentLessonId, cur.wordIdx); }
  render();
}

function nextQuiz(){
  const q = STATE.quiz;
  q.qIdx++; q.answered=false; q.chosen=null;
  if(q.qIdx>=q.order.length){
    const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
    const pct = Math.round(100*q.score/q.order.length);
    saveProgressField(l.id, p=>{ p.quizBest.quiz = Math.max(p.quizBest.quiz||0, pct); });
    logActivity("Trắc nghiệm nghĩa từ", "Kết quả "+q.score+"/"+q.order.length, {lessonId:l.id, lessonTitle:l.cn, score:pct});
  }
  render();
}

function buildListenQuestions(l, n){
  const idxs = shuffle([...Array(l.vocab.length).keys()]).slice(0, Math.min(n,l.vocab.length));
  return idxs.map(i=>{
    const correct = l.vocab[i];
    let pool = l.vocab.filter((w,j)=>j!==i);
    pool = shuffle(pool.slice()).slice(0,3);
    const opts = shuffle([correct, ...pool].map(w=>w.h));
    return {wordIdx:i, hz:correct.h, py:correct.p, answer:correct.h, opts};
  });
}

function initListen(){
  const l = LESSONS.find(x=>x.id===STATE.currentLessonId);
  STATE.listen = {qIdx:0, score:0, order:buildListenQuestions(l,8), answered:false, chosen:null, total:8};
}

        <button class="btn btn-jade" style="margin-bottom:22px" onclick="speak('${cur.hz}')">🔊 Nghe lại</button>
        <div class="quiz-opts">${optsHtml}</div>
        <div class="quiz-footer">
          <span class="quiz-score">Điểm: ${q.score}/${q.qIdx}</span>
          ${q.answered? `<button class="btn btn-primary btn-sm" onclick="nextListen()">Câu tiếp →</button>` : ""}
        </div>
      </div>

}

function answerListen(chosen){

  if(q.answered) return;

  }

}

function renderStatsPanel(l){
  const p = getProgress(STATE.user.username, l.id);
  const pct = Math.round(100*p.learned.length/l.vocab.length);
  const quizPct = p.quizBest.quiz!=null? p.quizBest.quiz+"%" : "Chưa làm";

        <div class="stat-card"><b>${quizPct}</b><span>Điểm trắc nghiệm tốt nhất</span></div>
        <div class="stat-card"><b>${listenPct}</b><span>Điểm nghe hiểu tốt nhất</span></div>
      </div>

function renderMyRecentActivity(lessonId){
  const rows = STATE.activities.filter(a=>a.username===STATE.user.username && a.lessonId===lessonId).slice(-10).reverse();

  return `<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Thời gian</th><th>Hoạt động</th><th>Chi tiết</th><th>Điểm</th></tr></thead><tbody>
    ${rows.map(a=>`<tr><td>${a.time}</td><td>${a.action}</td><td>${a.detail}</td><td>${a.score!=null? a.score+'%':'—'}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function allStudents(){ return STATE.users.filter(u=>u.role==="student"); }

function renderTeacherOverview(){
  const students = allStudents();
  const totalActivities = STATE.activities.length;
  const scores = STATE.activities.filter(a=>a.score!=null).map(a=>a.score);
  const avgScore = scores.length? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  let totalLearned=0, totalPossible=0;
  students.forEach(s=>{
    LESSONS.forEach(l=>{ const p=getProgress(s.username,l.id); totalLearned+=p.learned.length; totalPossible+=l.vocab.length; });
  });
  const avgProgress = totalPossible? Math.round(100*totalLearned/totalPossible):0;
  const recent = STATE.activities.slice(-8).reverse();

  return `
    <div class="section-title-row"><h2>📈 Tổng quan lớp học</h2></div>
    <div class="dash-grid">
      <div class="dash-card" style="cursor:default"><div class="di">🧑‍🎓</div><h4>${students.length}</h4><p>Học sinh đã đăng ký</p></div>
      <div class="dash-card" style="cursor:default"><div class="di">🗂️</div><h4>${totalActivities}</h4><p>Lượt hoạt động ghi nhận</p></div>
      <div class="dash-card" style="cursor:default"><div class="di">🎯</div><h4>${avgScore}%</h4><p>Điểm trắc nghiệm trung bình</p></div>
      <div class="dash-card" style="cursor:default"><div class="di">📚</div><h4>${avgProgress}%</h4><p>Tiến độ từ vựng trung bình lớp</p></div>
    </div>
    <div class="panel">
      <h3><span class="bar"></span>🕓 Hoạt động mới nhất</h3>
      ${recent.length===0? `<div class="empty-state"><div class="ei">🗒️</div>Chưa có hoạt động nào.</div>` : `
      <div class="data-table-wrap"><table class="data-table"><thead><tr><th>Thời gian</th><th>Học sinh</th><th>Bài</th><th>Hoạt động</th><th>Điểm</th></tr></thead><tbody>
        ${recent.map(a=>`<tr><td>${a.time}</td><td>${a.name}</td><td>${a.lessonTitle||'—'}</td><td>${a.action}</td><td>${a.score!=null?a.score+'%':'—'}</td></tr>`).join("")}
      </tbody></table></div>`}

  `;
}

function renderTeacherStudents(){
  const students = allStudents();
  const rows = students.map(s=>{

      <td><button class="btn btn-ghost btn-sm" onclick="viewStudentDetail('${s.username}')">Xem chi tiết</button></td>

    <div class="section-title-row"><h2>🧑‍🎓 Danh sách học sinh</h2></div>

      </table></div>

        <tbody>${acts.length===0? `<tr><td colspan="8" style="text-align:center;padding:30px;color:#a89a80">Chưa có dữ liệu giám sát.</td></tr>` : acts.map(a=>`

function filterMonitor(){
  const q = document.getElementById('monitorSearch').value.toLowerCase();
  const act = document.getElementById('monitorAction').value;
  document.querySelectorAll('#monitorTable tbody tr').forEach(tr=>{
    if(!tr.dataset.name) return;
    const matchName = tr.dataset.name.includes(q);
    const matchAction = !act || tr.dataset.action===act;
    tr.style.display = (matchName && matchAction) ? "" : "none";
  });
}

function renderTeacherResults(){
  const students = allStudents();
  const rows = [];
  students.forEach(s=>{
    LESSONS.forEach(l=>{
      const p = getProgress(s.username, l.id);
      if(p.quizBest.quiz==null && p.quizBest.listen==null && p.learned.length===0) return;
      rows.push({s,l,p});
    });
  });
  rows.sort((a,b)=> (b.p.quizBest.quiz||0)-(a.p.quizBest.quiz||0));
  return `
    <div class="section-title-row"><h2>📝 Bảng kết quả học tập</h2></div>
    <div class="panel">
      ${rows.length===0? `<div class="empty-state"><div class="ei">📝</div>Chưa có kết quả nào được ghi nhận.</div>` : `
      <div class="data-table-wrap"><table class="data-table">
        <thead><tr><th>Học sinh</th><th>Lớp</th><th>Bài học</th><th>Từ đã học</th><th>Trắc nghiệm</th><th>Nghe hiểu</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td><b>${r.s.name}</b></td><td>${r.s.cls||'—'}</td><td>Bài ${r.l.id}: ${r.l.cn}</td>
          <td>${r.p.learned.length}/${r.l.vocab.length}</td>
          <td>${r.p.quizBest.quiz!=null? `<span class="badge ${r.p.quizBest.quiz>=70?'badge-green':'badge-gold'}">${r.p.quizBest.quiz}%</span>`:'—'}</td>
          <td>${r.p.quizBest.listen!=null? `<span class="badge ${r.p.quizBest.listen>=70?'badge-green':'badge-gold'}">${r.p.quizBest.listen}%</span>`:'—'}</td>
        </tr>`).join("")}</tbody>
      </table></div>`}
    </div>
  `;
}

function attachHandlers(){
  const form = document.getElementById('authForm');
  if(form) form.addEventListener('submit', handleAuthSubmit);
}

function init(){
  loadAll();
  render();
}

init();
</script></body></html>
